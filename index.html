<style>
:root{--yellow:#f9a800;--black:#141414;--muted:#a4a4a0}
*{box-sizing:border-box}html{background:var(--black)}body{margin:0;color:var(--yellow);font-family:Arial,Helvetica,sans-serif}::selection{background:var(--yellow);color:var(--black)}
.page{min-height:100svh;max-width:1920px;margin:auto;padding:44px 56px 30px;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.name{font-size:17px;font-weight:700;letter-spacing:.18em;margin:0;line-height:1.5}.edition{font-family:monospace;font-size:13px;letter-spacing:.12em;line-height:1.7;text-align:right;color:var(--muted)}
main{display:grid;grid-template-columns:minmax(200px, .8fr) minmax(0,2fr);gap:clamp(38px,6vw,110px);align-items:start;flex:1;padding:60px 0 56px}

.statement{padding-top:20px}.line{width:64px;height:5px;background:var(--yellow);margin-bottom:30px}.status{font:14px/1.5 monospace;letter-spacing:.16em;margin-bottom:24px}h1{font-size:clamp(56px,7.5vw,120px);line-height:.93;letter-spacing:-.065em;margin:0;font-weight:900}h1 span{display:block}.translations{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:50px;padding-top:24px;border-top:1px solid #4d4124}.translation{font-size:clamp(18px,2vw,28px);line-height:1.25;letter-spacing:-.025em;margin:8px 0 0;font-weight:600}.lang{font:12px/1.5 monospace;color:var(--muted);letter-spacing:.12em}
footer{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #37332a;padding-top:22px;gap:20px;font:12px/1.5 monospace;letter-spacing:.10em;color:var(--muted)}footer a{color:var(--muted);text-decoration:none}.stripe{display:block;flex:0 0 90px;width:90px;height:8px;background:repeating-linear-gradient(135deg,var(--yellow) 0 7px,transparent 7px 14px)}
@media(min-width:1500px){main{align-items:center}.portrait{max-width:304px}.statement{padding-top:0}}
@media(max-width:760px){.page{padding:28px 24px 24px}header .name{font-size:14px}.edition{font-size:12px}main{grid-template-columns:1fr;gap:36px;padding:32px 0 38px}.portrait{width:155px}.caption{font-size:12px}.statement{padding:0}.line{margin-bottom:24px;width:44px;height:4px}.status{font-size:12px;margin-bottom:20px}h1{font-size:clamp(30px,10.3vw,76px);letter-spacing:-.06em}.translations{margin-top:32px;gap:20px;grid-template-columns:1fr}.translation{font-size:20px}footer{font-size:12px}.stripe{width:60px}}
@media(prefers-reduced-motion:no-preference){main{animation:appear .65s ease-out both}@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}}
